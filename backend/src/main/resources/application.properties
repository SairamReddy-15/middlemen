spring.application.name=farm-direct

# MySQL connection settings (overridable via environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/farmdirect_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Jackson / JSON
spring.jackson.serialization.write-dates-as-timestamps=false

# Server
server.port=${PORT:8080}

# Security / JWT
# Override JWT_SECRET in production. Must be at least 32 bytes (256-bit) long.
farmdirect.jwt.secret=${JWT_SECRET:farmdirect-development-secret-key-change-me-in-production-0123456789}
farmdirect.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Seed credentials (first start only)
farmdirect.seed.admin-email=${ADMIN_EMAIL:admin@farmdirect.com}
farmdirect.seed.admin-password=${ADMIN_PASSWORD:Admin@123}

# Logging
logging.level.org.hibernate.SQL=WARN
